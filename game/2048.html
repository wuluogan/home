<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>原版2048</title>
    
</head>
<body>
<div class="wrapper" id="gameWrapper">
    <div class="header">
        <div class="header-left">
            <span>2048</span>
        </div>
        <div class="header-right">
            <div class="header-right-score">
                <div class="score">
                    <span class="score-title">当前分数</span>
                    <span class="score-num" id="score">0</span>
                </div>
                <div class="score">
                    <span class="score-title">历史最高分</span>
                    <span class="score-num" id="bestScore">0</span>
                </div>
            </div>
            <div class="header-right-btn">
                <div class="btn" id="newGame">新游戏</div>
                <div class="btn" id="back">返回</div>
            </div>
        </div>
    </div>

    <div class="over" id="gameOver">
        <p>Game over!</p>
        <div class="btn" id="restart">再来一次</div>
    </div>

    <div class="box" id="gameBox">
        <!-- 游戏网格将通过JS动态生成 -->
    </div>
</div>

<script>
    // 游戏核心数据
    const gameData = {
        size: 4,
        score: 0,
        list: [],
        intiNum: [2, 4],
        pr: 0.9,
        bestScore: localStorage.getItem('bestScore') || 0,
        over: false,
        direction: [
            { x: 0, y: -1 }, // 上
            { x: 0, y: 1 },  // 下
            { x: -1, y: 0 }, // 左
            { x: 1, y: 0 }   // 右
        ],
        flag: 0,
        lastX: 0,
        lastY: 0
    };

    // DOM元素
    const elements = {
        scoreEl: document.getElementById('score'),
        bestScoreEl: document.getElementById('bestScore'),
        newGameBtn: document.getElementById('newGame'),
        backBtn: document.getElementById('back'),
        restartBtn: document.getElementById('restart'),
        gameOverEl: document.getElementById('gameOver'),
        gameBox: document.getElementById('gameBox'),
        gameWrapper: document.getElementById('gameWrapper')
    };

    // 初始化游戏
    function init() {
        elements.bestScoreEl.textContent = gameData.bestScore;
        newGame();
        bindEvents();
    }

    // 新游戏
    function newGame() {
        gameData.score = 0;
        gameData.over = false;
        elements.scoreEl.textContent = '0';
        elements.gameOverEl.style.display = 'none';

        // 初始化网格
        gameData.list = Array.from({ length: gameData.size }, () => Array(gameData.size).fill(null));
        renderGrid();
        setRandom();
    }

    // 渲染网格
    function renderGrid() {
        elements.gameBox.innerHTML = '';

        for (let i = 0; i < gameData.size; i++) {
            const row = document.createElement('div');
            row.className = 'row';

            for (let j = 0; j < gameData.size; j++) {
                const col = document.createElement('div');
                col.className = `col ${gameData.list[i][j] ? 'n-' + gameData.list[i][j] : ''}`;
                col.textContent = gameData.list[i][j] || '';
                row.appendChild(col);
            }

            elements.gameBox.appendChild(row);
        }
    }

    // 随机生成新数字
    function setRandom() {
        if (hasAvailableCells()) {
            const [x, y] = randomAvailableCells();
            gameData.list[x][y] = Math.random() < gameData.pr ? gameData.intiNum[0] : gameData.intiNum[1];
            renderGrid();
        }
    }

    // 获取随机空单元格坐标
    function randomAvailableCells() {
        const cells = availableCells();
        return cells[Math.floor(Math.random() * cells.length)];
    }

    // 获取所有空单元格
    function availableCells() {
        const cells = [];
        for (let i = 0; i < gameData.size; i++) {
            for (let j = 0; j < gameData.size; j++) {
                if (!gameData.list[i][j]) {
                    cells.push([i, j]);
                }
            }
        }
        return cells;
    }

    // 是否有空单元格
    function hasAvailableCells() {
        return availableCells().length > 0;
    }

    // 移动处理
    function move(directionIndex) {
        const rotated = rotate(Array.from(gameData.list), directionIndex);
        const moved = rotated.map(row => moveLeft([...row]));
        gameData.list = rotate(moved, gameData.size - directionIndex);

        setLocalStorage();
        renderGrid();

        if (!isAvailable()) {
            gameData.over = true;
            elements.gameOverEl.style.display = 'flex';
        }
    }

    // 向左移动一行
    function moveLeft(row) {
        let moved = false;
        const newRow = row.filter(cell => cell !== null);

        for (let i = 0; i < newRow.length - 1; i++) {
            if (newRow[i] === newRow[i + 1]) {
                newRow[i] *= 2;
                gameData.score += newRow[i];
                newRow.splice(i + 1, 1);
                moved = true;
            }
        }

        while (newRow.length < gameData.size) {
            newRow.push(null);
        }

        return newRow;
    }

    // 旋转网格
    function rotate(grid, times) {
        times = times % 4;
        if (times === 0) return grid;

        let rotated = Array.from({ length: gameData.size }, () => Array(gameData.size).fill(null));

        for (let i = 0; i < gameData.size; i++) {
            for (let j = 0; j < gameData.size; j++) {
                rotated[j][gameData.size - 1 - i] = grid[i][j];
            }
        }

        return times > 1 ? rotate(rotated, times - 1) : rotated;
    }

    // 检查游戏是否可继续
    function isAvailable() {
        return hasAvailableCells() || hasMergedCells();
    }

    // 检查是否有可合并的单元格
    function hasMergedCells() {
        for (let i = 0; i < gameData.size; i++) {
            for (let j = 0; j < gameData.size; j++) {
                const cell = gameData.list[i][j];
                if (cell) {
                    for (let dir = 0; dir < 4; dir++) {
                        const { x, y } = gameData.direction[dir];
                        const ni = i + x;
                        const nj = j + y;

                        if (ni >= 0 && ni < gameData.size && nj >= 0 && nj < gameData.size) {
                            if (gameData.list[ni][nj] === cell) {
                                return true;
                            }
                        }
                    }
                }
            }
        }
        return false;
    }

    // 保存最高分
    function setLocalStorage() {
        if (gameData.score > gameData.bestScore) {
            gameData.bestScore = gameData.score;
            localStorage.setItem('bestScore', gameData.bestScore);
            elements.bestScoreEl.textContent = gameData.bestScore;
        }
    }

    // 绑定事件
    function bindEvents() {
        // 新游戏按钮
        elements.newGameBtn.addEventListener('click', newGame);
        elements.restartBtn.addEventListener('click', newGame);

        // 返回按钮
        elements.backBtn.addEventListener('click', () => {
            if (history.length > 1) {
                history.back();
            } else {
                window.close();
            }
        });

        // 触摸事件
        let startX, startY;

        elements.gameWrapper.addEventListener('touchstart', (e) => {
            startX = e.touches[0].pageX;
            startY = e.touches[0].pageY;
        });

        elements.gameWrapper.addEventListener('touchend', (e) => {
            if (gameData.over) return;

            const endX = e.changedTouches[0].pageX;
            const endY = e.changedTouches[0].pageY;
            const diffX = endX - startX;
            const diffY = endY - startY;

            // 判断滑动方向
            if (Math.abs(diffX) > Math.abs(diffY)) {
                // 水平滑动
                if (diffX > 30) {
                    move(3); // 右
                } else if (diffX < -30) {
                    move(2); // 左
                }
            } else {
                // 垂直滑动
                if (diffY > 30) {
                    move(1); // 下
                } else if (diffY < -30) {
                    move(0); // 上
                }
            }

            if (Math.abs(diffX) > 30 || Math.abs(diffY) > 30) {
                setRandom();
            }
        });

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (gameData.over) return;

            switch (e.key) {
                case 'ArrowUp':
                    move(0);
                    setRandom();
                    break;
                case 'ArrowDown':
                    move(1);
                    setRandom();
                    break;
                case 'ArrowLeft':
                    move(2);
                    setRandom();
                    break;
                case 'ArrowRight':
                    move(3);
                    setRandom();
                    break;
            }
        });
    }

    // 初始化游戏
    window.onload = init;
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background-color: #faf8ef;
        width: 100%;
        min-height: 100vh;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .wrapper {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #776e65;
    }

    .header-left {
        flex: 1;
        background-color: #faf8ef;
        padding: 20px 0;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 8px;
        font-size: 36px;
        font-weight: bold;
    }

    .header-right {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .header-right-score {
        width: 100%;
        display: flex;
        gap: 10px;
    }

    .score {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #cec1b3;
        border-radius: 8px;
        padding: 10px;
    }

    .score-title {
        font-size: 14px;
        color: #eee4da;
    }

    .score-num {
        font-size: 22px;
        font-weight: bold;
        color: #fff;
    }

    .header-right-btn {
        width: 100%;
        display: flex;
        gap: 10px;
    }

    .btn {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        color: #f9f6f2;
        background: #8f7a66;
        font-weight: bold;
        transition: background 0.2s;
    }

    .btn:hover {
        background: #a28d78;
    }

    .box {
        width: 100%;
        aspect-ratio: 1/1;
        padding: 15px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #bbada0;
        border-radius: 8px;
    }

    .row {
        width: 100%;
        flex: 1;
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 15px;
    }

    .row:last-child {
        margin-bottom: 0;
    }

    .col {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        border-radius: 4px;
        background: #cec1b3;
        color: #776e65;
        transition: all 0.2s;
    }

    .n-2 { background: #f8f3e8; }
    .n-4 { background: #ede0c8; }
    .n-8 { background: #f2b179; color: #f9f6f2; }
    .n-16 { background: #f59563; color: #f9f6f2; }
    .n-32 { background: #f67c5f; color: #f9f6f2; }
    .n-64 { background: #f65e36; color: #f9f6f2; }
    .n-128 { background: #edcf72; color: #f9f6f2; font-size: 24px; }
    .n-256 { background: #edcc61; color: #f9f6f2; font-size: 24px; }
    .n-512 { background: #edc850; color: #f9f6f2; font-size: 24px; }
    .n-1024 { background: #edc53f; color: #f9f6f2; font-size: 20px; }
    .n-2048 { background: #edc22e; color: #f9f6f2; font-size: 20px; }
    .n-4096 { background: #3c3a32; color: #f9f6f2; font-size: 20px; }
    .n-8192 { background: #3c3a32; color: #f9f6f2; font-size: 20px; }

    .over {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: rgba(238, 228, 218, 0.73);
        z-index: 1000;
        color: #8f7a66;
    }

    .over p {
        font-size: 40px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .over .btn {
        padding: 15px 30px;
        font-size: 18px;
    }
</style>
</body>
</html>
