<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }
        .difficulty {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .difficulty label {
            font-weight: bold;
            color: #555;
        }
        .difficulty select {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background-color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            background-color: #4a6fa5;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #3a5a80;
        }
        .game-area {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .board-container {
            position: relative;
            margin-right: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 600px;
            height: 600px;
            background-color: #E9BB5E;
            position: relative;
            border: 3px solid #573200;
            border-radius: 2px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .horizontal-labels, .vertical-labels {
            position: absolute;
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 0 20px;
            color: #573200;
            font-weight: bold;
        }
        .horizontal-labels {
            top: -25px;
        }
        .vertical-labels {
            flex-direction: column;
            height: 100%;
            left: -25px;
            align-items: center;
        }
        .cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-right: 1px solid #573200;
            border-bottom: 1px solid #573200;
        }
        .cell:nth-child(15n) {
            border-right: none;
        }
        .cell:nth-child(n+211) {
            border-bottom: none;
        }
        .cell::before {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #573200;
            border-radius: 50%;
            opacity: 0;
            z-index: 1;
        }
        .cell[data-row="3"][data-col="3"]::before,
        .cell[data-row="3"][data-col="11"]::before,
        .cell[data-row="7"][data-col="7"]::before,
        .cell[data-row="11"][data-col="3"]::before,
        .cell[data-row="11"][data-col="11"]::before {
            opacity: 1;
        }
        .piece {
            width: 85%;
            height: 85%;
            border-radius: 50%;
            position: absolute;
            z-index: 2;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
        }
        .black {
            background: radial-gradient(circle at 30% 30%, #666, #000);
        }
        .white {
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
        }
        .highlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 0, 0.3);
            z-index: 1;
        }
        .game-info {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .status {
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            transition: all 0.3s;
        }
        .game-over {
            background-color: #f8d7da;
            color: #721c24;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .move-history {
            flex-grow: 1;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            max-height: 500px;
        }
        .move-history h3 {
            margin-bottom: 10px;
            color: #333;
            text-align: center;
        }
        .moves {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .move {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
        }
        .move:last-child {
            border-bottom: none;
        }
        .player {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .piece-mini {
            width: 15px;
            height: 15px;
            border-radius: 50%;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            animation: modalOpen 0.3s forwards;
        }
        @keyframes modalOpen {
            to { transform: scale(1); }
        }
        .modal h2 {
            margin-bottom: 20px;
            color: #4a6fa5;
        }
        .modal p {
            margin-bottom: 30px;
            font-size: 1.2rem;
            color: #555;
        }
        .modal button {
            padding: 10px 25px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>五子棋游戏</h1>
        </div>
        <div class="controls">
            <div class="difficulty">
                <label for="difficulty-select">难度级别:</label>
                <select id="difficulty-select">
                    <option value="easy">简单</option>
                    <option value="medium" selected>中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
            <button id="restart-btn">重新开始</button>
        </div>
        <div class="game-area">
            <div class="board-container">
                <div class="horizontal-labels"></div>
                <div class="vertical-labels"></div>
                <div class="board" id="board"></div>
            </div>
            <div class="game-info">
                <div class="status" id="status">轮到玩家(黑子)走棋</div>
                <div class="move-history">
                    <h3>棋谱记录</h3>
                    <div class="moves" id="moves"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2 id="winner-text">游戏结束</h2>
            <p id="winner-message">获胜方</p>
            <button id="new-game-btn">开始新游戏</button>
        </div>
    </div>

    <script>
        // 游戏常量
        const BOARD_SIZE = 15;
        const EMPTY = 0;
        const PLAYER = 1;
        const COMPUTER = 2;
        const WINNING_LENGTH = 5;
        
        // 游戏状态
        let board = [];
        let currentPlayer = PLAYER;
        let gameOver = false;
        let difficulty = 'medium';
        let moveHistory = [];
        
        // DOM 元素
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const movesElement = document.getElementById('moves');
        const difficultySelect = document.getElementById('difficulty-select');
        const restartBtn = document.getElementById('restart-btn');
        const gameOverModal = document.getElementById('game-over-modal');
        const winnerText = document.getElementById('winner-text');
        const winnerMessage = document.getElementById('winner-message');
        const newGameBtn = document.getElementById('new-game-btn');
        const horizontalLabelsElement = document.querySelector('.horizontal-labels');
        const verticalLabelsElement = document.querySelector('.vertical-labels');

        // 初始化
        function initializeGame() {
            initializeBoard();
            createBoardUI();
            createBoardLabels();
            updateStatus();
            
            // 事件监听器
            difficultySelect.addEventListener('change', function() {
                difficulty = this.value;
            });
            
            restartBtn.addEventListener('click', restartGame);
            newGameBtn.addEventListener('click', restartGame);
        }
        
        function initializeBoard() {
            board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(EMPTY));
            currentPlayer = PLAYER;
            gameOver = false;
            moveHistory = [];
        }
        
        function createBoardUI() {
            boardElement.innerHTML = '';
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.addEventListener('click', () => handleCellClick(row, col));
                    boardElement.appendChild(cell);
                }
            }
        }
        
        function createBoardLabels() {
            horizontalLabelsElement.innerHTML = '';
            verticalLabelsElement.innerHTML = '';
            
            // 创建水平标签 (A-O)
            for (let i = 0; i < BOARD_SIZE; i++) {
                const label = document.createElement('div');
                label.textContent = String.fromCharCode(65 + i);
                horizontalLabelsElement.appendChild(label);
            }
            
            // 创建垂直标签 (1-15)
            for (let i = 0; i < BOARD_SIZE; i++) {
                const label = document.createElement('div');
                label.textContent = i + 1;
                verticalLabelsElement.appendChild(label);
            }
        }
        
        function handleCellClick(row, col) {
            // 如果游戏结束或者单元格已经有棋子，则不处理
            if (gameOver || board[row][col] !== EMPTY || currentPlayer !== PLAYER) {
                return;
            }
            
            makeMove(row, col, PLAYER);
            
            // 检查玩家是否赢得游戏
            if (checkWin(row, col, PLAYER)) {
                endGame(PLAYER);
                return;
            }
            
            // 检查是否平局
            if (isBoardFull()) {
                endGame(EMPTY);
                return;
            }
            
            // AI 回合
            currentPlayer = COMPUTER;
            updateStatus();
            
            // 添加延迟使AI走棋看起来更自然
            setTimeout(() => {
                computerMove();
                
                // 检查电脑是否赢得游戏
                const lastMove = moveHistory[moveHistory.length - 1];
                if (checkWin(lastMove.row, lastMove.col, COMPUTER)) {
                    endGame(COMPUTER);
                    return;
                }
                
                // 检查是否平局
                if (isBoardFull()) {
                    endGame(EMPTY);
                    return;
                }
                
                currentPlayer = PLAYER;
                updateStatus();
            }, 300);
        }
        
        function makeMove(row, col, player) {
            board[row][col] = player;
            
            // 记录走棋
            const moveNotation = `${String.fromCharCode(65 + col)}${row + 1}`;
            moveHistory.push({
                player: player,
                row: row,
                col: col,
                notation: moveNotation
            });
            
            // 更新 UI
            const cell = boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            const piece = document.createElement('div');
            piece.className = `piece ${player === PLAYER ? 'black' : 'white'}`;
            cell.appendChild(piece);
            
            updateMoveHistory();
        }

        // 优化后的AI逻辑
        function computerMove() {
            // 根据难度选择AI算法
            let move;
            switch (difficulty) {
                case 'easy':
                    move = findEasyMove();
                    break;
                case 'medium':
                    move = findMediumMove();
                    break;
                case 'hard':
                    move = findHardMove();
                    break;
                default:
                    move = findMediumMove();
            }
            
            makeMove(move.row, move.col, COMPUTER);
        }
        
        // 简单AI: 有一定防守和进攻能力，但主要是随机
        function findEasyMove() {
            // 第一步放在中心位置附近
            if (moveHistory.length === 0) {
                const center = Math.floor(BOARD_SIZE / 2);
                // 在中心的3x3区域随机选一点
                const offset = [-1, 0, 1][Math.floor(Math.random() * 3)];
                return { 
                    row: center + offset, 
                    col: center + [-1, 0, 1][Math.floor(Math.random() * 3)] 
                };
            }
            
            // 检查是否可以直接获胜
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY) {
                        board[row][col] = COMPUTER;
                        if (checkWin(row, col, COMPUTER)) {
                            board[row][col] = EMPTY;
                            return { row, col };
                        }
                        board[row][col] = EMPTY;
                    }
                }
            }
            
            // 检查是否需要阻止玩家直接获胜
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY) {
                        board[row][col] = PLAYER;
                        if (checkWin(row, col, PLAYER)) {
                            board[row][col] = EMPTY;
                            return { row, col };
                        }
                        board[row][col] = EMPTY;
                    }
                }
            }
            
            // 随机选择一个周围的空位
            return findRandomMove();
        }
        
        // 中等AI: 更智能的防守和进攻
        function findMediumMove() {
            // 第一步放在中心位置
            if (moveHistory.length === 0) {
                const center = Math.floor(BOARD_SIZE / 2);
                return { row: center, col: center };
            }
            
            // 检查是否可以直接获胜
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY) {
                        board[row][col] = COMPUTER;
                        if (checkWin(row, col, COMPUTER)) {
                            board[row][col] = EMPTY;
                            return { row, col };
                        }
                        board[row][col] = EMPTY;
                    }
                }
            }
            
            // 检查是否需要阻止玩家直接获胜
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY) {
                        board[row][col] = PLAYER;
                        if (checkWin(row, col, PLAYER)) {
                            board[row][col] = EMPTY;
                            return { row, col };
                        }
                        board[row][col] = EMPTY;
                    }
                }
            }
            
            // 寻找最佳位置
            return findBestPositionQuick();
        }
        
        // 困难AI: 更进一步的策略分析
        function findHardMove() {
            // 第一步放在中心位置
            if (moveHistory.length === 0) {
                const center = Math.floor(BOARD_SIZE / 2);
                return { row: center, col: center };
            }
            
            // 检查是否可以直接获胜
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY) {
                        board[row][col] = COMPUTER;
                        if (checkWin(row, col, COMPUTER)) {
                            board[row][col] = EMPTY;
                            return { row, col };
                        }
                        board[row][col] = EMPTY;
                    }
                }
            }
            
            // 检查是否需要阻止玩家直接获胜
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY) {
                        board[row][col] = PLAYER;
                        if (checkWin(row, col, PLAYER)) {
                            board[row][col] = EMPTY;
                            return { row, col };
                        }
                        board[row][col] = EMPTY;
                    }
                }
            }
            
            // 寻找更高级的策略位置
            return findBestPosition();
        }

        // 随机找一个有意义的位置
        function findRandomMove() {
            const emptyCells = [];
            
            // 优先考虑已有棋子周围的空位
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] !== EMPTY) {
                        // 检查周围8个方向
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                
                                const newRow = row + dr;
                                const newCol = col + dc;
                                
                                if (newRow >= 0 && newRow < BOARD_SIZE && 
                                    newCol >= 0 && newCol < BOARD_SIZE && 
                                    board[newRow][newCol] === EMPTY &&
                                    !emptyCells.some(cell => cell.row === newRow && cell.col === newCol)) {
                                    emptyCells.push({ row: newRow, col: newCol });
                                }
                            }
                        }
                    }
                }
            }
            
            // 如果没有找到周围的空位，找任意空位
            if (emptyCells.length === 0) {
                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        if (board[row][col] === EMPTY) {
                            emptyCells.push({ row, col });
                        }
                    }
                }
            }
            
            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }
        
        // 快速找到一个相对较好的位置 (中等难度)
        function findBestPositionQuick() {
            let bestScore = -Infinity;
            let bestMove = null;
            
            // 只评估已有棋子周围的位置
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY && hasNeighbor(row, col)) {
                        // 评估这个位置的得分
                        const score = evaluatePosition(row, col);
                        
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = { row, col };
                        }
                    }
                }
            }
            
            // 如果没有找到好的位置，随机选择
            return bestMove || findRandomMove();
        }
        
        // 寻找最佳位置 (困难难度)
        function findBestPosition() {
            let bestScore = -Infinity;
            let bestMove = null;
            
            // 评估所有可能的位置
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY && hasNeighbor(row, col)) {
                        // 尝试放置棋子
                        board[row][col] = COMPUTER;
                        
                        // 使用更深层的评估
                        const score = evaluatePositionDeep(row, col);
                        
                        // 恢复棋盘
                        board[row][col] = EMPTY;
                        
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = { row, col };
                        }
                    }
                }
            }
            
            return bestMove || findRandomMove();
        }
        
        // 检查周围是否有棋子
        function hasNeighbor(row, col) {
            const distance = 2; // 检查2格内是否有棋子
            
            for (let dr = -distance; dr <= distance; dr++) {
                for (let dc = -distance; dc <= distance; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    
                    const newRow = row + dr;
                    const newCol = col + dc;
                    
                    if (newRow >= 0 && newRow < BOARD_SIZE && 
                        newCol >= 0 && newCol < BOARD_SIZE && 
                        board[newRow][newCol] !== EMPTY) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        // 评估位置的得分 (基本评估)
        function evaluatePosition(row, col) {
            let score = 0;
            
            // 临时放置棋子
            board[row][col] = COMPUTER;
            
            // 评估所有方向
            const directions = [
                [0, 1],   // 水平
                [1, 0],   // 垂直
                [1, 1],   // 对角线 \
                [1, -1]   // 对角线 /
            ];
            
            for (const [dr, dc] of directions) {
                // 计算己方(电脑)的连续棋子
                score += evaluateDirection(row, col, dr, dc, COMPUTER);
                
                // 计算阻止对方(玩家)的价值
                score += evaluateDirection(row, col, dr, dc, PLAYER) * 0.8;
            }
            
            // 恢复棋盘
            board[row][col] = EMPTY;
            
            return score;
        }
        
        // 评估位置的得分 (更深入的评估，考虑更多策略因素)
        function evaluatePositionDeep(row, col) {
            let score = evaluatePosition(row, col);
            
            // 考虑位置的战略价值
            // 中心位置更有价值
            const centerRow = Math.floor(BOARD_SIZE / 2);
            const centerCol = Math.floor(BOARD_SIZE / 2);
            const distanceToCenter = Math.sqrt(Math.pow(row - centerRow, 2) + Math.pow(col - centerCol, 2));
            score -= distanceToCenter * 0.5; // 离中心越远，分数越低
            
            // 如果周围有更多己方棋子，分数更高
            let computerCount = 0;
            let playerCount = 0;
            
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    
                    const newRow = row + dr;
                    const newCol = col + dc;
                    
                    if (newRow >= 0 && newRow < BOARD_SIZE && newCol >= 0 && newCol < BOARD_SIZE) {
                        if (board[newRow][newCol] === COMPUTER) {
                            computerCount++;
                        } else if (board[newRow][newCol] === PLAYER) {
                            playerCount++;
                        }
                    }
                }
            }
            
            score += computerCount * 2; // 每个相邻的己方棋子加分
            score += playerCount; // 每个相邻的对方棋子也加分，但权重低一些
            
            return score;
        }
        
        // 评估特定方向上的棋形
        function evaluateDirection(row, col, dr, dc, player) {
            let score = 0;
            let ownCount = 1; // 当前位置已计算
            let emptyCount = 0;
            let blocked = 0;
            
            // 向一个方向搜索
            for (let i = 1; i < 5; i++) {
                const newRow = row + i * dr;
                const newCol = col + i * dc;
                
                if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE) {
                    blocked++;
                    break;
                }
                
                if (board[newRow][newCol] === player) {
                    ownCount++;
                } else if (board[newRow][newCol] === EMPTY) {
                    emptyCount++;
                    break;
                } else {
                    blocked++;
                    break;
                }
            }
            
            // 向相反方向搜索
            for (let i = 1; i < 5; i++) {
                const newRow = row - i * dr;
                const newCol = col - i * dc;
                
                if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE) {
                    blocked++;
                    break;
                }
                
                if (board[newRow][newCol] === player) {
                    ownCount++;
                } else if (board[newRow][newCol] === EMPTY) {
                    emptyCount++;
                    break;
                } else {
                    blocked++;
                    break;
                }
            }
            
            // 评分规则
            if (ownCount >= 5) {
                return 10000; // 五连
            }
            
            if (blocked === 0) {
                // 两端都开放
                if (ownCount === 4) return 2000;      // 活四
                else if (ownCount === 3) return 1000; // 活三
                else if (ownCount === 2) return 100;  // 活二
                else if (ownCount === 1) return 10;   // 单子
            } else if (blocked === 1) {
                // 一端被封
                if (ownCount === 4) return 500;      // 冲四
                else if (ownCount === 3) return 100; // 眠三
                else if (ownCount === 2) return 10;  // 眠二
                else if (ownCount === 1) return 1;   // 单子
            }
            
            return 0;
        }
        
        function checkWin(row, col, player) {
            const directions = [
                [0, 1],   // 水平
                [1, 0],   // 垂直
                [1, 1],   // 对角线 \
                [1, -1]   // 对角线 /
            ];
            
            for (const [dx, dy] of directions) {
                let count = 1;  // 当前位置已经有一个棋子
                
                // 向一个方向检查
                for (let i = 1; i < WINNING_LENGTH; i++) {
                    const newRow = row + i * dx;
                    const newCol = col + i * dy;
                    
                    if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE || board[newRow][newCol] !== player) {
                        break;
                    }
                    
                    count++;
                }
                
                // 向相反方向检查
                for (let i = 1; i < WINNING_LENGTH; i++) {
                    const newRow = row - i * dx;
                    const newCol = col - i * dy;
                    
                    if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE || board[newRow][newCol] !== player) {
                        break;
                    }
                    
                    count++;
                }
                
                if (count >= WINNING_LENGTH) {
                    // 高亮显示获胜线
                    highlightWinningLine(row, col, dx, dy, player);
                    return true;
                }
            }
            
            return false;
        }
        
        function highlightWinningLine(row, col, dx, dy, player) {
            // 向一个方向高亮
            highlightCell(row, col);
            
            for (let i = 1; i < WINNING_LENGTH; i++) {
                const newRow = row + i * dx;
                const newCol = col + i * dy;
                
                if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE || board[newRow][newCol] !== player) {
                    break;
                }
                
                highlightCell(newRow, newCol);
            }
            
            // 向相反方向高亮
            for (let i = 1; i < WINNING_LENGTH; i++) {
                const newRow = row - i * dx;
                const newCol = col - i * dy;
                
                if (newRow < 0 || newRow >= BOARD_SIZE || newCol < 0 || newCol >= BOARD_SIZE || board[newRow][newCol] !== player) {
                    break;
                }
                
                highlightCell(newRow, newCol);
            }
        }
        
        function highlightCell(row, col) {
            const cell = boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            const highlight = document.createElement('div');
            highlight.className = 'highlight';
            cell.appendChild(highlight);
        }
        
        function isBoardFull() {
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === EMPTY) {
                        return false;
                    }
                }
            }
            return true;
        }
        
        function endGame(winner) {
            gameOver = true;
            
            if (winner === PLAYER) {
                winnerText.textContent = "恭喜你赢了！";
                winnerMessage.textContent = "黑子获胜！";
                statusElement.textContent = "游戏结束，黑子获胜！";
            } else if (winner === COMPUTER) {
                winnerText.textContent = "电脑赢了！";
                winnerMessage.textContent = "白子获胜！";
                statusElement.textContent = "游戏结束，白子获胜！";
            } else {
                winnerText.textContent = "平局！";
                winnerMessage.textContent = "棋盘已满，没有胜负。";
                statusElement.textContent = "游戏结束，平局！";
            }
            
            statusElement.classList.add('game-over');
            gameOverModal.style.display = 'flex';
        }
        
        function updateStatus() {
            if (currentPlayer === PLAYER) {
                statusElement.textContent = "轮到玩家(黑子)走棋";
            } else {
                statusElement.textContent = "轮到电脑(白子)走棋";
            }
            statusElement.classList.remove('game-over');
        }
        
        function updateMoveHistory() {
            movesElement.innerHTML = '';
            
            moveHistory.forEach((move, index) => {
                const moveElement = document.createElement('div');
                moveElement.className = 'move';
                
                const playerElement = document.createElement('div');
                playerElement.className = 'player';
                
                const pieceMini = document.createElement('div');
                pieceMini.className = `piece-mini ${move.player === PLAYER ? 'black' : 'white'}`;
                
                const moveText = document.createElement('span');
                moveText.textContent = `${index + 1}. ${move.notation}`;
                
                playerElement.appendChild(pieceMini);
                playerElement.appendChild(moveText);
                moveElement.appendChild(playerElement);
                
                movesElement.appendChild(moveElement);
            });
            
            // 滚动到最新的移动记录
            movesElement.scrollTop = movesElement.scrollHeight;
        }
        
        function restartGame() {
            initializeBoard();
            
            // 清除棋盘上的所有棋子和高亮
            const cells = boardElement.querySelectorAll('.cell');
            cells.forEach(cell => {
                while (cell.firstChild) {
                    cell.removeChild(cell.firstChild);
                }
            });
            
            updateStatus();
            updateMoveHistory();
            gameOverModal.style.display = 'none';
        }
        
        // 启动游戏
        window.onload = initializeGame;
    </script>
</body>
</html>
