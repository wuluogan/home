<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书签管理器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        input[type="text"] {
            padding: 5px;
            margin-right: 10px;
            width: calc(100% - 21px);
            box-sizing: border-box;
        }
        button {
            padding: 5px 10px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between; /* 分配剩余空间 */
        }
        a {
            text-decoration: none;
            color: inherit;
            margin-left: 10px;
        }
        a:hover {
            text-decoration: underline;
        }
        img {
            width: 32px;
            height: 32px;
            margin-right: 10px;
            border-radius: 4px;
        }
        #fileInput {
            display: none;
        }
        .actions {
            display: flex;
            gap: 5px;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .category-container {
            margin-bottom: 10px;
        }
        .category-select {
            padding: 5px;
            width: calc(100% - 21px);
            box-sizing: border-box;
        }
        .search-container {
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            body {
                margin: 10px;
            }
            input[type="text"], .category-select {
                width: 100%;
            }
            button {
                width: 100%;
                margin-top: 5px;
            }
            .actions {
                flex-direction: column;
                width: 100%;
            }
            .actions button {
                width: 100%;
            }
            .search-container {
                flex-direction: column;
            }
            .search-container input[type="text"] {
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="header-actions">
        <h1>书签管理器</h1>
        <div>
            <button onclick="exportBookmarks()">导出书签</button>
            <button onclick="document.getElementById('fileInput').click()">导入书签</button>
            <input type="file" id="fileInput" accept=".json" onchange="importBookmarks(this.files)">
            <label><input type="checkbox" id="themeToggle"> 暗黑模式</label>
        </div>
    </div>
    <div class="category-container">
        <select id="categorySelect" class="category-select" onchange="filterByCategory()">
            <option value="">所有分类</option>
        </select>
        <input type="text" id="urlInput" placeholder="请输入网址">
        <input type="text" id="noteInput" placeholder="请输入备注">
        <input type="text" id="categoryInput" placeholder="请输入分类">
        <button id="actionButton" onclick="addBookmark()">添加书签</button>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="搜索网址或备注..." onkeyup="filterBookmarks()">
        <input type="text" id="categorySearchInput" placeholder="搜索分类..." onkeyup="filterBookmarks()">
    </div>
    <ul id="bookmarkList"></ul>

    <script>
        // Load bookmarks and categories from localStorage on page load
        window.onload = function() {
            renderCategories();
            renderBookmarks();
            document.getElementById('themeToggle').addEventListener('change', toggleTheme);
            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggle').checked = true;
            }
        };

        let currentEditingId = null;

        function fetchBookmarks() {
            const bookmarksString = localStorage.getItem('bookmarks');
            return bookmarksString ? JSON.parse(bookmarksString) : [];
        }

        function saveBookmarks(bookmarks) {
            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
        }

        function fetchCategories() {
            const categoriesSet = new Set(fetchBookmarks().map(bm => bm.category).filter(cat => cat));
            return Array.from(categoriesSet);
        }

        function saveCategories(categories) {
            // Categories are derived from bookmarks, no need to store separately
        }

        function renderCategories() {
            const categorySelect = document.getElementById('categorySelect');
            categorySelect.innerHTML = '<option value="">所有分类</option>';
            fetchCategories().forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        function renderBookmarks() {
            const bookmarks = fetchBookmarks();
            const bookmarkList = document.getElementById('bookmarkList');
            bookmarkList.innerHTML = '';
            bookmarks.forEach((bookmark) => {
                const li = document.createElement('li');

                // Fetch favicon
                const iconImg = document.createElement('img');
                iconImg.src = getIconUrl(bookmark.url);
                li.appendChild(iconImg);

                // 链接和备注
                const link = document.createElement('a');
                link.href = bookmark.url;
                link.target = '_blank';
                link.textContent = bookmark.url;
                li.appendChild(link);
                li.appendChild(document.createTextNode(` - ${bookmark.note}`));

                // Category
                if (bookmark.category) {
                    const categorySpan = document.createElement('span');
                    categorySpan.textContent = ` (${bookmark.category})`;
                    li.appendChild(categorySpan);
                }

                // Actions container
                const actionsContainer = document.createElement('div');
                actionsContainer.className = 'actions';

                // 编辑按钮
                const editButton = document.createElement('button');
                editButton.textContent = '编辑';
                editButton.onclick = () => startEditBookmark(bookmark.id);
                actionsContainer.appendChild(editButton);

                // 删除按钮
                const deleteButton = document.createElement('button');
                deleteButton.textContent = '删除';
                deleteButton.onclick = () => deleteBookmark(bookmark.id);
                actionsContainer.appendChild(deleteButton);

                li.appendChild(actionsContainer);

                bookmarkList.appendChild(li);
            });
        }

        function addBookmark() {
            const urlInput = document.getElementById('urlInput');
            const noteInput = document.getElementById('noteInput');
            const categoryInput = document.getElementById('categoryInput');
            const url = urlInput.value.trim();
            const note = noteInput.value.trim();
            const category = categoryInput.value.trim();

            if (!url) {
                alert('请填写网址');
                return;
            }

            const bookmarks = fetchBookmarks();
            const newId = bookmarks.length > 0 ? bookmarks[bookmarks.length - 1].id + 1 : 1;
            const newBookmark = { id: newId, url, note, category };
            bookmarks.push(newBookmark);
            saveBookmarks(bookmarks);
            resetForm();
            renderBookmarks();
            renderCategories(); // Update categories after adding a new bookmark
        }

        function deleteBookmark(id) {
            let bookmarks = fetchBookmarks();
            bookmarks = bookmarks.filter(bookmark => bookmark.id !== id);
            saveBookmarks(bookmarks);
            renderBookmarks();
            renderCategories(); // Update categories after deleting a bookmark
        }

        function startEditBookmark(id) {
            const bookmarks = fetchBookmarks();
            const bookmarkToEdit = bookmarks.find(bookmark => bookmark.id === id);
            if (bookmarkToEdit) {
                document.getElementById('urlInput').value = bookmarkToEdit.url;
                document.getElementById('noteInput').value = bookmarkToEdit.note;
                document.getElementById('categoryInput').value = bookmarkToEdit.category || '';
                document.getElementById('actionButton').textContent = '保存编辑';
                document.getElementById('actionButton').onclick = () => saveEditedBookmark(id);
                currentEditingId = id;
            }
        }

        function saveEditedBookmark(id) {
            const urlInput = document.getElementById('urlInput');
            const noteInput = document.getElementById('noteInput');
            const categoryInput = document.getElementById('categoryInput');
            const url = urlInput.value.trim();
            const note = noteInput.value.trim();
            const category = categoryInput.value.trim();

            if (!url) {
                alert('请填写网址');
                return;
            }

            let bookmarks = fetchBookmarks();
            bookmarks = bookmarks.map(bookmark => {
                if (bookmark.id === id) {
                    return { ...bookmark, url, note, category };
                }
                return bookmark;
            });
            saveBookmarks(bookmarks);
            resetForm();
            renderBookmarks();
            renderCategories(); // Update categories after editing a bookmark
        }

        function filterBookmarks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categorySearchTerm = document.getElementById('categorySearchInput').value.toLowerCase();
            const bookmarks = fetchBookmarks();
            const filteredBookmarks = bookmarks.filter(
                (bookmark) =>
                    (bookmark.url.toLowerCase().includes(searchTerm) ||
                     bookmark.note.toLowerCase().includes(searchTerm)) &&
                    (categorySearchTerm === '' || bookmark.category?.toLowerCase().includes(categorySearchTerm))
            );
            displayFilteredBookmarks(filteredBookmarks);
        }

        function filterByCategory() {
            const selectedCategory = document.getElementById('categorySelect').value;
            const bookmarks = fetchBookmarks();
            const filteredBookmarks = bookmarks.filter(
                (bookmark) => !selectedCategory || bookmark.category === selectedCategory
            );
            displayFilteredBookmarks(filteredBookmarks);
        }

        function displayFilteredBookmarks(filteredBookmarks) {
            const bookmarkList = document.getElementById('bookmarkList');
            bookmarkList.innerHTML = '';
            filteredBookmarks.forEach((bookmark) => {
                const li = document.createElement('li');

                // Fetch favicon
                const iconImg = document.createElement('img');
                iconImg.src = getIconUrl(bookmark.url);
                li.appendChild(iconImg);

                // 链接和备注
                const link = document.createElement('a');
                link.href = bookmark.url;
                link.target = '_blank';
                link.textContent = bookmark.url;
                li.appendChild(link);
                li.appendChild(document.createTextNode(` - ${bookmark.note}`));

                // Category
                if (bookmark.category) {
                    const categorySpan = document.createElement('span');
                    categorySpan.textContent = ` (${bookmark.category})`;
                    li.appendChild(categorySpan);
                }

                // Actions container
                const actionsContainer = document.createElement('div');
                actionsContainer.className = 'actions';

                // 编辑按钮
                const editButton = document.createElement('button');
                editButton.textContent = '编辑';
                editButton.onclick = () => startEditBookmark(bookmark.id);
                actionsContainer.appendChild(editButton);

                // 删除按钮
                const deleteButton = document.createElement('button');
                deleteButton.textContent = '删除';
                deleteButton.onclick = () => deleteBookmark(bookmark.id);
                actionsContainer.appendChild(deleteButton);

                li.appendChild(actionsContainer);

                bookmarkList.appendChild(li);
            });
        }

        function getIconUrl(url) {
            try {
                const parsedUrl = new URL(url);
                return `${parsedUrl.origin}/favicon.ico`;
            } catch (e) {
                return 'https://via.placeholder.com/32x32'; // 占位符图标
            }
        }

        function exportBookmarks() {
            const bookmarks = fetchBookmarks();
            const jsonContent = JSON.stringify(bookmarks, null, 2);
            const blob = new Blob([jsonContent], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'bookmarks.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importBookmarks(files) {
            if (files.length === 0) return;

            const file = files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                try {
                    const bookmarks = JSON.parse(event.target.result);
                    saveBookmarks(bookmarks);
                    renderBookmarks();
                    renderCategories();
                    alert('书签导入成功');
                } catch (error) {
                    alert('无效的JSON文件');
                }
            };

            reader.readAsText(file);
        }

        function resetForm() {
            document.getElementById('urlInput').value = '';
            document.getElementById('noteInput').value = '';
            document.getElementById('categoryInput').value = '';
            document.getElementById('actionButton').textContent = '添加书签';
            document.getElementById('actionButton').onclick = addBookmark;
            currentEditingId = null;
        }

        function toggleTheme() {
            const darkModeEnabled = document.getElementById('themeToggle').checked;
            document.body.classList.toggle('dark-mode', darkModeEnabled);
            localStorage.setItem('darkMode', darkModeEnabled);
        }
    </script>
</body>
</html>
