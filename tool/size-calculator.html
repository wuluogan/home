        .result-box {
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .alert-success {

            background-color: #d4edda;

    // 当选择类型变化时更新界面
    function bindPickerChange(selectElement) {
        ci = selectElement.value;
        const data = sizeData[ci] || sizeData[3]; // 默认使用女装数据

        // 更新标题和说明
        document.getElementById('cm_title').textContent = data.title;
        document.getElementById('cm_shuoming').innerHTML = data.shuoming;
        document.getElementById('sizeTableContainer').innerHTML = data.table;

        // 更新输入框提示
        if (shengaoInput && tizhongInput) {
            shengaoInput.placeholder = data.tishi1;
            tizhongInput.placeholder = data.tishi2;

            // 重置输入框类型
            shengaoInput.type = data.tishi1.includes("选择") ? "text" : "number";
            tizhongInput.type = data.tishi2.includes("选择") ? "text" : "number";
        }

        // 添加额外输入字段
        additionalFields.innerHTML = "";
        if (data.additional && data.additional.length > 0) {
            data.additional.forEach(field => {
                if (field.type === "select") {
                    let selectHtml = `<select class="form-select" id="${field.id}" style="margin-bottom:15px">`;
                    field.options.forEach(option => {
                        selectHtml += `<option value="${option.value}">${option.text}</option>`;
                    });
                    selectHtml += `</select>`;
                    additionalFields.innerHTML += selectHtml;
                } else {
                    additionalFields.innerHTML += `
                            <input type="number" class="form-control" id="${field.id}"
                                   placeholder="${field.placeholder}">
                        `;
                }
            });
        }
    }

    // 点击生成尺码按钮时执行
    function btnClick() {
        const value1 = shengaoInput.type === "number" ? parseFloat(shengaoInput.value) : shengaoInput.value;
        const value2 = tizhongInput.type === "number" ? parseFloat(tizhongInput.value) : tizhongInput.value;
        const resultElement = document.getElementById('chimaInfo');

        // 验证输入
        if ((shengaoInput.type === "number" && isNaN(value1)) ||
            (tizhongInput.type === "number" && isNaN(value2))) {
            resultElement.innerHTML = "<strong>请输入有效的数值！</strong>";
            resultElement.style.display = "block";
            return;
        }

        // 获取额外输入字段的值
        const additionalValues = {};
        const data = sizeData[ci] || sizeData[3];
        if (data.additional && data.additional.length > 0) {
            data.additional.forEach(field => {
                const elem = document.getElementById(field.id);
                if (elem) {
                    additionalValues[field.id] = elem.type === "number" ? parseFloat(elem.value) : elem.value;
                    // 验证额外字段
                    if (elem.type === "number" && isNaN(additionalValues[field.id])) {
                        resultElement.innerHTML = `<strong>请输入有效的${field.placeholder}！</strong>`;
                        resultElement.style.display = "block";
                        return;
                    }
                }
            });
        }

        // 根据不同类型计算推荐尺码
        let result = "";
        switch(ci) {
            case "3": // 女装
                result = calculateWomenClothes(value1, value2);
                break;
            case "7": // 男装
                result = calculateMenClothes(value1, value2);
                break;
            case "4": // 女衬衫
                result = calculateWomenShirt(value1, value2);
                break;
            case "5": // 连衣裙
                result = calculateDress(value1, value2, additionalValues.xiongwei);
                break;
            case "6": // 女裤子
                result = calculateWomenPants(value1, value2, additionalValues.shengao_kz);
                break;
            case "8": // 男衬衫
                result = calculateMenShirt(value1, value2);
                break;
            case "10": // 男裤子
                result = calculateMenPants(value1, value2);
                break;
            case "15": // 文胸
                result = calculateBraSize(value1, value2);
                break;
            case "16": // 内裤
                result = calculateUnderwearSize(value1, value2);
                break;
            case "17": // 鞋码
                result = calculateShoeSize(value1, value2, additionalValues.xingbie);
                break;
            default:
                result = "<strong>抱歉，该类型的尺码计算功能正在开发中</strong>";
        }

        // 显示结果
        resultElement.innerHTML = result;
        resultElement.style.display = "block";

        resultElement.classList.add('alert-success');

    // 女装尺码计算
    function calculateWomenClothes(height, weight) {
        const bmi = (weight / 2) / (height / 100) **2;
        let size = "";

        if (height < 155) {
            size = "S";
        } else if (height < 165) {
            size = bmi < 20 ? "S" : bmi < 24 ? "M" : "L";
        } else if (height < 175) {
            size = bmi < 20 ? "M" : bmi < 24 ? "L" : "XL";
        } else {
            size = bmi < 22 ? "L" : "XL";
        }

        return `<strong>推荐尺码：${size}</strong><br>
                    您的身高：${height}cm，体重：${weight}斤<br>
                    BMI指数：${bmi.toFixed(1)}（正常范围18.5-23.9）`;
    }

    // 男装尺码计算
    function calculateMenClothes(height, weight) {
        const bmi = (weight / 2) / (height / 100)** 2;
        let size = "";

        if (height < 165) {
            size = "S (165/84A)";
        } else if (height < 175) {
            size = bmi < 20 ? "M (170/88A)" : bmi < 24 ? "L (175/92A)" : "XL (180/96A)";
        } else if (height < 185) {
            size = bmi < 20 ? "L (175/92A)" : bmi < 24 ? "XL (180/96A)" : "XXL (185/100A)";
        } else {
            size = bmi < 22 ? "XL (180/96A)" : "XXL (185/100A) 或 XXXL (190/104A)";
        }

        return `<strong>推荐尺码：${size}</strong><br>
                    您的身高：${height}cm，体重：${weight}斤<br>
                    BMI指数：${bmi.toFixed(1)}（正常范围18.5-23.9）`;
    }

    // 女衬衫尺码计算
    function calculateWomenShirt(height, weight) {
        let size = "";

        if (height < 155 && weight < 90) {
            size = "S (36)";
        } else if (height < 165 && weight < 110) {
            size = "M (37-38)";
        } else if (height < 175 && weight < 130) {
            size = "L (38-39)";
        } else {
            size = "XL (40及以上)";
        }

        return `<strong>推荐尺码：${size}</strong><br>
                    您的身高：${height}cm，体重：${weight}斤`;
    }

    // 连衣裙尺码计算
    function calculateDress(height, weight, bust) {
        if (!bust) {
            return `<strong>请输入胸围信息以获得更准确的推荐</strong>`;
        }

        let size = "";

        if (height < 155) {
            size = bust < 80 ? "XS" : bust < 84 ? "S" : "M";
        } else if (height < 165) {
            size = bust < 84 ? "S" : bust < 88 ? "M" : bust < 92 ? "L" : "XL";
        } else if (height < 175) {
            size = bust < 88 ? "M" : bust < 92 ? "L" : bust < 96 ? "XL" : "XXL";
        } else {
            size = bust < 92 ? "L" : bust < 96 ? "XL" : "XXL";
        }

        return `<strong>推荐尺码：${size}</strong><br>
                    您的身高：${height}cm，体重：${weight}斤，胸围：${bust}cm`;
    }

    // 女裤子尺码计算
    function calculateWomenPants(waist, hip, height) {
        let size = "";

        if (waist < 60) {
            size = "24码";
        } else if (waist < 63) {
            size = "25码";
        } else if (waist < 67) {
            size = "26码";
        } else if (waist < 70) {
            size = "27码";
        } else if (waist < 73) {
            size = "28码";
        } else if (waist < 77) {
            size = "29码";
        } else if (waist < 80) {
            size = "30码";
        } else {
            size = "31码及以上";
        }

        let lengthTip = "";
        if (height) {
            if (height < 155 && size >= "28码") lengthTip = "<br>提示：您可能需要修改裤长";
            if (height > 170 && size <= "26码") lengthTip = "<br>提示：您可能需要选择加长款";
        }

        return `<strong>推荐尺码：${size}</strong><br>
                    您的腰围：${waist}cm，臀围：${hip}cm${lengthTip}`;
    }

    // 男衬衫尺码计算
    function calculateMenShirt(collar, height) {
        let size = "";

        if (collar < 38) {
            size = "37码";
        } else if (collar < 39) {
            size = "38码";
        } else if (collar < 40) {
            size = "39码";
        } else if (collar < 41) {
            size = "40码";
        } else if (collar < 42) {
            size = "41码";
        } else if (collar < 43) {
            size = "42码";
        } else {
            size = "43码及以上";
        }

        let heightTip = "";
        if (height) {
            if (height < 165 && collar >= 40) heightTip = "<br>提示：建议试穿，注意衣长";
            if (height > 185 && collar <= 39) heightTip = "<br>提示：建议试穿，注意衣长";
        }

        return `<strong>推荐尺码：${size}</strong><br>
                    您的领围：${collar}cm，身高：${height}cm${heightTip}`;
    }

    // 男裤子尺码计算
    function calculateMenPants(waist, hip) {
        let size = "";

        if (waist < 70) {
            size = "27码";
        } else if (waist < 73) {
            size = "28码";
        } else if (waist < 77) {
            size = "29码";
        } else if (waist < 80) {
            size = "30码";
        } else if (waist < 83) {
            size = "31码";
        } else if (waist < 87) {
            size = "32码";
        } else if (waist < 90) {
            size = "33码";
        } else {
            size = "34码及以上";
        }

        return `<strong>推荐尺码：${size}</strong><br>
                    您的腰围：${waist}cm，臀围：${hip}cm`;
    }

    // 文胸尺码计算 - 修复了变量名错误
    function calculateBraSize(upperBust, lowerBust) {
        const cupDiff = upperBust - lowerBust;
        let cup = "";

        if (cupDiff < 10) cup = "A";
        else if (cupDiff < 15) cup = "B";
        else if (cupDiff < 20) cup = "C";
        else if (cupDiff < 25) cup = "D";
        else cup = "E";

        // 下胸围尺码
        let bandSize = Math.round(lowerBust / 5) * 5;
        let chinaSize = Math.round(bandSize / 2.5) + cup;

        return `<strong>推荐文胸尺码：${bandSize}${cup} / ${chinaSize}</strong><br>
                    您的上胸围：${upperTypeBust}cm，下胸围：${lowerBust}cm<br>
                    罩杯差：${cupDiff}cm，对应罩杯：${cup}`;
    }

    // 内裤尺码计算
    function calculateUnderwearSize(waist, hip) {
        // 判断当前是否是男士内裤
        const isMale = ci === "16" && waist > 70; // 简单判断

        let size = "";

        if (isMale) {
            if (waist < 70 && hip < 95) {
                size = "M";
            } else if (waist < 74 && hip < 100) {
                size = "L";
            } else if (waist < 82 && hip < 105) {
                size = "XL";
            } else {
                size = "XXL";
            }
        } else {
            if (waist < 61 && hip < 86) {
                size = "S";
            } else if (waist < 70 && hip < 93) {
                size = "M";
            } else if (waist < 80 && hip < 100) {
                size = "L";
            } else {
                size = "XL";
            }
        }

        return `<strong>推荐内裤尺码：${size}</strong><br>
                    您的腰围：${waist}cm，臀围：${hip}cm`;
    }

    // 鞋码计算
    function calculateShoeSize(footLength, genderText, gender) {
        if (!gender) gender = genderText === "男" ? "male" : "female";

        // 中国码直接对应脚长(mm)
        const chinaSize = Math.round(footLength / 5) * 5;
        // 欧码计算公式
        const euSize = Math.round(chinaSize / 5 + 50);
        // 美码和英码根据性别有差异
        let usSize, ukSize;

        if (gender === "male") {
            usSize = (chinaSize - 220) / 5 + 3.5;
            ukSize = usSize - 0.5;
        } else {
            usSize = (chinaSize - 220) / 5 + 5;
            ukSize = usSize - 2;
        }

        return `<strong>推荐鞋码：</strong><br>
                    中国码：${chinaSize}mm<br>
                    欧码(EU)：${euSize}<br>
                    美码(US)：${usSize.toFixed(1)}<br>
                    英码(UK)：${ukSize.toFixed(1)}<br>
                    <small>提示：不同品牌可能存在差异，建议参考具体品牌尺码表</small>`;
    }
