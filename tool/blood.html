<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>子女血型查询</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <style>
        .container {
            align-items: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: flex-start;
            margin: 20rpx auto 0;
            padding: 15rpx 0;
            width: 95%;
        }

        form {
            margin: 10px auto;
            width: 100%;
        }

        .picker {
            position: relative;
            background-color: #f5f4f9;
            border-radius: 20rpx;
            font-size: 13pt;
            height: 30pt;
            line-height: 30pt;
            padding: 5px;
            text-align: center;
            width: 100%;
            cursor: pointer;
        }

        .picker .fa-edit {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .itemButtom {
            padding: 5px 5px 5px 0;
            text-align: center;
            margin-top: 20px;
        }

        .seachButtom {
            background-color: #1aad19;
            border-radius: 3pt;
            color: #fff;
            font-size: 13pt;
            height: 30pt;
            line-height: 30pt;
            width: 60pt;
            border: none;
            padding: 0 15px;
            cursor: pointer;
        }

        .paragraphs {
            background-color: #ececec;
            border-radius: 20rpx;
            color: #353535;
            font-size: 14pt;
            margin-top: 20px;
            padding: 15px;
            text-align: left;
            width: 100%;
            display: none;
        }

        .paragraph {
            line-height: 25px;
        }

        .tool-info {
            padding-top: 2rem;
            width: 100%;
        }

        .tool-info .title {
            font-size: 16px;
            font-weight: 700;
            padding-bottom: 5px;
            display: block;
        }

        .tool-info .info {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            padding-bottom: 10px;
            display: block;
        }

        /* 血型选择弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            padding: 20px;
        }

        .modal-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .blood-selector {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .blood-select-item {
            width: 48%;
        }

        .blood-select-item label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .blood-select-item select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .modal-confirm {
            text-align: center;
        }

        .modal-confirm button {
            background-color: #1aad19;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="after-navber">
    <div class="container">
        <form id="bloodForm">
            <div>
                <!-- 血型选择器 -->
                <div class="picker" id="bloodPicker">
                    <span id="bloodDisplay">您的血型：A型 , 配偶血型：A型</span>
                    <i class="fa fa-edit"></i>
                </div>
            </div>

            <!-- 血型选择弹窗 -->
            <div class="modal-overlay" id="pickerModal">
                <div class="modal-content">
                    <div class="modal-title">选择血型</div>
                    <div class="blood-selector">
                        <div class="blood-select-item">
                            <label>您的血型</label>
                            <select id="myBloodType">
                                <option value="0">A型</option>
                                <option value="1">B型</option>
                                <option value="2">O型</option>
                                <option value="3">AB型</option>
                            </select>
                        </div>
                        <div class="blood-select-item">
                            <label>配偶血型</label>
                            <select id="partnerBloodType">
                                <option value="0">A型</option>
                                <option value="1">B型</option>
                                <option value="2">O型</option>
                                <option value="3">AB型</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-confirm">
                        <button type="button" id="confirmBlood">确认</button>
                    </div>
                </div>
            </div>

            <div class="itemButtom">
                <button type="button" class="seachButtom" id="queryButton">查询</button>
            </div>
        </form>

        <div class="paragraphs" id="resultArea">
            <div class="paragraph" id="resultText"></div>
        </div>

        <div class="tool-info">
            <span class="title">血型知识</span>
            <span class="info">
                    在医学上，血型一般分为 AA 、OA、BB 、OB、AB 和 O 型六种血型，AA 型和
                    OA 型统称为 A 型，BB 型和 OB 型也统称为 B 型。
                    子女的血型是取父亲血型的一部分（ A 、B 或 O ）和母亲血型的一部分（ A
                    、B 或
                    O）混合而成的新的血型，这个新的血型就是子女的血型，所以子女的血型与父母的血型有关。
                </span>
        </div>
    </div>
</div>

<script>
    // 状态变量
    const blood = [
        ["A型", "B型", "O型", "AB型"],
        ["A型", "B型", "O型", "AB型"]
    ];
    const setBlood = ["A", "B", "O", "AB"];
    let b = [0, 0]; // [我的血型索引, 配偶血型索引]
    let flag = 0;
    let dataInfo = "";

    // DOM元素
    const bloodPicker = document.getElementById('bloodPicker');
    const pickerModal = document.getElementById('pickerModal');
    const bloodDisplay = document.getElementById('bloodDisplay');
    const myBloodType = document.getElementById('myBloodType');
    const partnerBloodType = document.getElementById('partnerBloodType');
    const confirmBlood = document.getElementById('confirmBlood');
    const queryButton = document.getElementById('queryButton'); // 查询按钮
    const resultArea = document.getElementById('resultArea');
    const resultText = document.getElementById('resultText');

    // 初始化
    function init() {
        // 绑定事件处理函数
        bloodPicker.addEventListener('click', showPickerModal);
        confirmBlood.addEventListener('click', confirmBloodSelection);
        queryButton.addEventListener('click', formSubmit); // 绑定查询按钮点击事件

        // 初始化显示
        updateBloodDisplay();
    }

    // 显示血型选择弹窗
    function showPickerModal() {
        pickerModal.style.display = 'flex';
        myBloodType.value = b[0];
        partnerBloodType.value = b[1];
    }

    // 确认血型选择
    function confirmBloodSelection() {
        b[0] = parseInt(myBloodType.value);
        b[1] = parseInt(partnerBloodType.value);
        updateBloodDisplay();
        pickerModal.style.display = 'none';
    }

    // 更新血型显示
    function updateBloodDisplay() {
        bloodDisplay.textContent = `您的血型：${blood[0][b[0]]} , 配偶血型：${blood[1][b[1]]}`;
    }

    // 表单提交处理
    function formSubmit() {
        let result = "请选择正确的血型";
        const myBlood = setBlood[b[0]];
        const partnerBlood = setBlood[b[1]];

        // 血型组合判断逻辑
        if (myBlood === "A" && partnerBlood === "B" ||
            myBlood === "B" && partnerBlood === "A") {
            result = "您的孩子的血型可能为 A 型、B 型、AB 型、O 型";
        } else if (myBlood === "A" && partnerBlood === "A" ||
            myBlood === "A" && partnerBlood === "O" ||
            myBlood === "O" && partnerBlood === "A") {
            result = "您的孩子的血型可能为 A 型或 O 型，不可能为 B 型 和 AB 型";
        } else if (myBlood === "A" && partnerBlood === "AB" ||
            myBlood === "AB" && partnerBlood === "A") {
            result = "您的孩子的血型可能为  A 型 、B型 及 AB型之一，不可能为 O 型";
        } else if (myBlood === "B" && partnerBlood === "B" ||
            myBlood === "B" && partnerBlood === "O" ||
            myBlood === "O" && partnerBlood === "B") {
            result = "您的孩子的血型可能为 B 型或 O 型，不可能为 A 型 和 AB 型";
        } else if (myBlood === "B" && partnerBlood === "AB" ||
            myBlood === "AB" && partnerBlood === "B") {
            result = "您的孩子的血型可能为  A 型 、B型 及 AB型之一，不可能为 O 型";
        } else if (myBlood === "O" && partnerBlood === "O") {
            result = "您的孩子的血型可能为 O 型，不可能为 A 型、B 型和 AB 型";
        } else if (myBlood === "O" && partnerBlood === "AB" ||
            myBlood === "AB" && partnerBlood === "O") {
            result = "您的孩子的血型可能为 A 型或 B 型，不可能为 O 型 和 AB 型";
        } else if (myBlood === "AB" && partnerBlood === "AB") {
            result = "您的孩子的血型可能为  A 型 、B型 及 AB型之一，不可能为 O 型";
        }

        // 显示结果
        dataInfo = result;
        flag = 1;
        resultText.textContent = dataInfo;
        resultArea.style.display = 'block';

        // 滚动到结果区域
        resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 初始化页面
    window.onload = init;
</script>
</body>
</html>
