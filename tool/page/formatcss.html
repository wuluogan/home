<!DOCTYPE html>
<html lang="zh-CN">
    
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>
            {$Think.config.web.formatcss.title}
        </title>
        <meta name="applicable-device" content="pc,mobile" />
        <meta http-equiv="Cache-Control" content="no-transform" />
        <meta http-equiv="Cache-Control" content="no-siteapp" />
        <!-- <meta name="keywords" content="{$Think.config.web.formatcss.keywords}"
        />
        <meta name="description" content="{$Think.config.web.formatcss.description}"
        /> -->
        <meta name="renderer" content="webkit" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon"
        />
        <link href="../assets/css/bootstrap.min.css" rel="stylesheet" type="text/css"
        />
        <link href="../assets/css/tool.css" rel="stylesheet" type="text/css" />
    </head>
    
    <body>
        <div id="header"></div>

        <div class="container">
            <div class="row">
                <div class="col-md-12 col10main">
                    <div class="accordion" id="accordion2">
                        <div class="accordion-group">
                                                            </li>
                            </ul>
                            <div class="panel">
                                <form id="form1" class="form-horizontal">
                                    <div class="form-group">
                                        <div class="col-sm-12">
                                            <textarea class="form-control" id="content" name="content" rows="12" placeholder="请输入要格式化的CSS代码">
                                            </textarea>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="col-sm-12 text-center">
                                            <label class="checkbox-inline">
                                                <input type="checkbox" id="delnotes">
                                                删除注释
                                            </label>
                                            <label class="checkbox-inline">
                                                <input type="checkbox" id="tolower" checked>
                                                属性转小写
                                            </label>
                                            <label class="checkbox-inline">
                                                <input type="checkbox" id="chk">
                                                横向排列
                                            </label>
                                            <button type="button" class="btn btn-success" onclick="format_css('format');">
                                                格式化
                                            </button>
                                            <button type="button" class="btn btn-success" onclick="format_css('pack');">
                                                压缩
                                            </button>
                                            <span id="copyallcode" class="btn btn-default" data-clipboard-target="#result">
                                                复制
                                            </span>
                                            <input class="btn btn-default" onclick="Empty()" id="BtnClear" type="button"
                                            value="清空">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="col-sm-12">
                                            <pre>
                                                <code id="result">
                                                    结果输出区域
                                                </code>
                                            </pre>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="alert alert alert-success alert-dismissible">
                            <h4>
                                CSS在线格式化、美化、压缩工具介绍
                            </h4>
                            <p>
                                网上有不少CSS格式化压缩的工具，但是不少站点有广告干扰，或操作起来不方便，或打开速度比较慢，所以自己定制了这个css格式化压缩的工具，也希望对大家有帮助，提供的这个CSS代码格式化和css在线压缩工具，不需要下载使用YUI
                                Compressor 或 CSSTidy等离线格式化工具，直接在线压缩操作即可。
                            </p>
                        </div>
                        <div class="accordion-group">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="../assets/js/jquery-1.11.3.min.js" type="text/javascript">
        </script>
        <script src="../assets/js/bootstrap.min.js" type="text/javascript">
        </script>
        <script src="../assets/js/tool.js" type="text/javascript">
        </script>
        <script src="../assets/js/cssformat.js" type="text/javascript">
        </script>
        <script src="../assets/js/hightout.js">
        </script>

        <div id="footer"></div>

    </body>

</html>
