<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap TTS 语音朗读器</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .tts-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .voice-selector {
            margin-top: 20px;
        }
        #text-to-speak {
            min-height: 150px;
        }
        .slider-container {
            margin-top: 15px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<div class="container tts-container">
    <h1 class="text-center mb-4">Bootstrap TTS 语音朗读器</h1>

    <div class="mb-3">
        <label for="text-to-speak" class="form-label">输入要朗读的文本：</label>
        <textarea class="form-control" id="text-to-speak" rows="5">这是一个使用Bootstrap和浏览器内置TTS功能的语音朗读器示例。你可以调整语速、音调和选择不同的语音。</textarea>
    </div>

    <div class="controls d-flex flex-wrap gap-2 mb-3">
        <button id="speak-btn" class="btn btn-primary">朗读</button>
        <button id="pause-btn" class="btn btn-secondary" disabled>暂停</button>
        <button id="resume-btn" class="btn btn-success" disabled>继续</button>
        <button id="stop-btn" class="btn btn-danger" disabled>停止</button>
    </div>

    <div class="voice-selector mb-3">
        <label for="voice-select" class="form-label">选择语音：</label>
        <select id="voice-select" class="form-select"></select>
    </div>

    <div class="row rate-pitch">
        <div class="col-md-6 slider-container">
            <div class="slider-label">
                <span>语速: <span id="rate-value">1</span></span>
            </div>
            <input type="range" id="rate" class="form-range" min="0.5" max="2" step="0.1" value="1">
        </div>

        <div class="col-md-6 slider-container">
            <div class="slider-label">
                <span>音调: <span id="pitch-value">1</span></span>
            </div>
            <input type="range" id="pitch" class="form-range" min="0.5" max="2" step="0.1" value="1">
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const textInput = document.getElementById('text-to-speak');
        const speakBtn = document.getElementById('speak-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const stopBtn = document.getElementById('stop-btn');
        const voiceSelect = document.getElementById('voice-select');
        const rateSlider = document.getElementById('rate');
        const pitchSlider = document.getElementById('pitch');
        const rateValue = document.getElementById('rate-value');
        const pitchValue = document.getElementById('pitch-value');

        let speechSynthesis = window.speechSynthesis;
        let speechUtterance = null;
        let voices = [];

        // 更新语速和音调显示值
        rateSlider.addEventListener('input', () => {
            rateValue.textContent = rateSlider.value;
        });

        pitchSlider.addEventListener('input', () => {
            pitchValue.textContent = pitchSlider.value;
        });

        // 加载可用语音
        function loadVoices() {
            voices = speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';

            // 筛选中文语音优先
            const chineseVoices = voices.filter(voice =>
                voice.lang.includes('zh') || voice.lang.includes('cmn')
            );

            const otherVoices = voices.filter(voice =>
                !voice.lang.includes('zh') && !voice.lang.includes('cmn')
            );

            // 添加中文语音选项
            if (chineseVoices.length > 0) {
                const chineseGroup = document.createElement('optgroup');
                chineseGroup.label = '中文语音';
                chineseVoices.forEach(voice => {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.setAttribute('data-name', voice.name);
                    chineseGroup.appendChild(option);
                });
                voiceSelect.appendChild(chineseGroup);
            }

            // 添加其他语音选项
            if (otherVoices.length > 0) {
                const otherGroup = document.createElement('optgroup');
                otherGroup.label = '其他语音';
                otherVoices.forEach(voice => {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.setAttribute('data-name', voice.name);
                    otherGroup.appendChild(option);
                });
                voiceSelect.appendChild(otherGroup);
            }

            // 默认选择第一个中文语音，如果没有则选择第一个语音
            if (chineseVoices.length > 0) {
                voiceSelect.selectedIndex = 0;
            } else if (voices.length > 0) {
                voiceSelect.selectedIndex = 0;
            }
        }

        // 语音加载可能需要时间
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); // 立即尝试加载

        // 朗读文本
        speakBtn.addEventListener('click', () => {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }

            const text = textInput.value.trim();
            if (!text) {
                alert('请输入要朗读的文本！');
                return;
            }

            speechUtterance = new SpeechSynthesisUtterance(text);

            // 设置选中的语音
            const selectedOption = voiceSelect.selectedOptions[0];
            if (selectedOption) {
                const voiceName = selectedOption.getAttribute('data-name');
                const selectedVoice = voices.find(voice => voice.name === voiceName);
                if (selectedVoice) {
                    speechUtterance.voice = selectedVoice;
                }
            }

            // 设置语速和音调
            speechUtterance.rate = parseFloat(rateSlider.value);
            speechUtterance.pitch = parseFloat(pitchSlider.value);

            // 启用/禁用按钮
            speakBtn.disabled = true;
            pauseBtn.disabled = false;
            stopBtn.disabled = false;
            resumeBtn.disabled = true;

            // 朗读结束后的回调
            speechUtterance.onend = () => {
                speakBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                resumeBtn.disabled = true;
            };

            speechSynthesis.speak(speechUtterance);
        });

        // 暂停朗读
        pauseBtn.addEventListener('click', () => {
            if (speechSynthesis.speaking) {
                speechSynthesis.pause();
                pauseBtn.disabled = true;
                resumeBtn.disabled = false;
            }
        });

        // 继续朗读
        resumeBtn.addEventListener('click', () => {
            if (speechSynthesis.paused) {
                speechSynthesis.resume();
                pauseBtn.disabled = false;
                resumeBtn.disabled = true;
            }
        });

        // 停止朗读
        stopBtn.addEventListener('click', () => {
            speechSynthesis.cancel();
            speakBtn.disabled = false;
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
            stopBtn.disabled = true;
        });
    });
</script>
</body>
</html>
